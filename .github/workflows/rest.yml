name: MSE SARIF REST upload
on:
  push:
    branches: [sarif-rest-cli-test]
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Upload via MSE CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run demo-uploader/main.go demo-uploader/upload.go --file results.sarif --category mse-rest-cli
