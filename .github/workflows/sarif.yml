name: MSE SARIF import
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: mse-demo
